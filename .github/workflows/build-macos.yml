name: Build iOS Game

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Xcode project
        run: |
          if [ ! -d "Unity-iPhone.xcodeproj" ]; then
            echo "ERROR: Unity-iPhone.xcodeproj not found"
            exit 1
          fi

      - name: Build iOS application
        run: |
          xcodebuild \
            -project "$GITHUB_WORKSPACE/Unity-iPhone.xcodeproj" \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/Unity-iPhone.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: iOS application was not created"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/ipa/Payload"

          ditto "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/Unity-iPhone.app"

          cd "$RUNNER_TEMP/ipa"

          zip -r "$RUNNER_TEMP/UnityGame-unsigned.ipa" Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unity-iOS-unsigned-IPA
          path: ${{ runner.temp }}/UnityGame-unsigned.ipa
          if-no-files-found: error
