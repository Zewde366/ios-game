name: Build macOS Application

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install the Apple certificate and provisioning profile
      env:
        BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      run: |
        # إنشاء متغيرات محلية مؤقتة
        CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
        PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
        KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

        # تحويل الشهادات المشفرة من Base64 لحالتها الأصلية
        echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
        echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

        # إنشاء Keychain مؤقت لاستضافة الشهادة بأمان
        security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
        security default-keychain -s $KEYCHAIN_PATH
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

        # استيراد الشهادة إلى الـ Keychain
        security import $CERTIFICATE_PATH -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -A -T /usr/bin/codesign
        security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

        # تثبيت الـ Provisioning Profile في مساره الخاص بنظام macOS
        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
        cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

    - name: Build Xcode Project
      run: |
        # استبدال 'Unity-iPhone' باسم الـ Scheme الخاص بمشروعك إذا كان مختلفاً
        xcodebuild -project Unity-iPhone.xcodeproj                    -scheme Unity-iPhone                    -configuration Release                    -archivePath $RUNNER_TEMP/Unity-iPhone.xcarchive                    archive

    - name: Export IPA / APP
      run: |
        # تصدير اللعبة بصيغتها النهائية
        xcodebuild -exportArchive                    -archivePath $RUNNER_TEMP/Unity-iPhone.xcarchive                    -exportPath $RUNNER_TEMP/build_output                    -exportOptionsPlist ExportOptions.plist

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v3
      with:
        name: macOS-Build
        path: ${{ runner.temp }}/build_output/
